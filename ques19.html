<html>
<head>
  <title>Footer Example</title>
</head>
<body>
  <form autocomplete="off">
  <label>Username: <input type="text" required></label><br>
  <label>Password: <input type="password" required></label><br>
  <button type="submit">Login</button>
</form>
<p>Note: Turning off autocomplete prevents browsers from storing sensitive data like passwords, improving security.</p>

</body>
</html>
